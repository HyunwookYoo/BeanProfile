name: release

# BeanProfile 배포 파이프라인 — v* 태그 push 또는 수동 빌드 시 실행.
#
# 세 경로가 나란히 돈다:
#  - ios      : "미서명" .ipa → GitHub Release. 서명·설치는 로컬 AltStore가 담당.
#  - appstore : 서명된 .ipa → App Store Connect 업로드. 서명 시크릿이 있을 때만 실행.
#  - android  : 업로드 키로 서명한 .aab → Play 내부 테스트. 에뮬레이터 release 스모크(android-smoke)를
#               통과해야 돈다. 수동 실행은 업로드 대신 아티팩트로 남긴다.
# App Store 심사를 통과하기 전까지 AltStore 경로가 유일한 설치 수단이므로 함께 유지한다.
# 규약: docs/deployment.md · 계획: docs/plans/milestone-0-delivery.md · docs/plans/android-play-release-design.md
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_name:
        description: '빌드 버전 (예: 1.0.3) — 진단 IPA와 Play 첫 업로드용 AAB에 쓴다'
        required: true
        type: string

permissions:
  contents: write   # GitHub Release 생성/자산 업로드에 필요

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Codegen (drift 등) — 있을 때만
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "build_runner 미설치 — codegen 건너뜀 (M1에서 활성화)"
          fi
      - run: flutter analyze
      - run: flutter test

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # SPM 자동 마이그레이션을 끈다 — 켜두면 Pods_Runner 링크가 깨진다(§6-E).
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: Build unsigned iOS app
        env:
          MANUAL_BUILD_NAME: ${{ inputs.build_name }}
          OCR_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          BUILD_NAME="${GITHUB_REF_NAME#v}"
          if [ -n "$MANUAL_BUILD_NAME" ]; then
            BUILD_NAME="$MANUAL_BUILD_NAME"
          fi
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$BUILD_NAME" \
            --dart-define=ENABLE_OCR_DIAGNOSTICS="$OCR_DIAGNOSTICS"
      - name: Package unsigned .ipa
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 "$GITHUB_WORKSPACE/beanprofile-${GITHUB_REF_NAME}.ipa" Payload
      - name: Upload diagnostic .ipa
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: beanprofile-diagnostic-${{ inputs.build_name }}-${{ github.run_number }}
          path: beanprofile-${{ github.ref_name }}.ipa
          retention-days: 7
      - name: Publish GitHub Release (+.ipa 자산)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: BeanProfile ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            무료 Apple ID(AltStore) 경로용 **미서명** iOS 빌드.
            설치: 아이폰에서 이 .ipa를 내려받아 AltStore → My Apps → + 로 선택하면
            AltStore가 서명해 설치합니다. (PC에서 AltServer 실행 + 같은 WiFi 필요)
          files: beanprofile-${{ github.ref_name }}.ipa

  # 서명 시크릿이 아직 없을 때 appstore 잡을 통째로 건너뛰기 위한 게이트.
  # secrets 컨텍스트는 job 수준 if에서 못 읽으므로 별도 잡의 output으로 넘긴다.
  appstore-gate:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          if [ -n "$CERT_B64" ] && [ -n "$PROFILE_B64" ] && [ -n "$KEY_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store 서명 시크릿이 없어 업로드를 건너뜁니다. AltStore용 미서명 .ipa는 정상 생성됩니다."
          fi

  appstore:
    needs: [test, appstore-gate]
    if: needs.appstore-gate.outputs.ready == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # SPM 자동 마이그레이션을 끈다 — 켜두면 Pods_Runner 링크가 깨진다(§6-E).
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get

      - name: 배포 인증서 가져오기
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      # 프로파일 이름을 하드코딩하지 않고 프로파일 자체에서 읽어 쓴다.
      # 맥이 없어 CI 로그로만 진단해야 하므로, 이름 오타 한 글자로 막히는 경로를 없앤다
      # (.ipa 파일명을 ls로 찾는 것과 같은 이유 — docs/deployment.md §8).
      - name: 프로비저닝 프로파일 설치 + ExportOptions.plist 생성
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          dest="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dest"
          echo "$PROFILE_B64" | base64 -d > /tmp/profile.mobileprovision
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/profile.plist)
          cp /tmp/profile.mobileprovision "$dest/$uuid.mobileprovision"
          echo "프로파일 '$name' / UUID $uuid / 팀 $team"
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$team</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hyunwook.beanprofile</key><string>$uuid</string>
            </dict>
          </dict>
          </plist>
          EOF

      # 진단 기능은 App Store 빌드에 절대 실리면 안 되므로 false로 못박는다.
      - name: 서명된 .ipa 빌드
        run: |
          BUILD_NAME="${GITHUB_REF_NAME#v}"
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$BUILD_NAME" \
            --dart-define=ENABLE_OCR_DIAGNOSTICS=false \
            --export-options-plist=ios/ExportOptions.plist

      - name: .ipa 경로 확인
        run: echo "IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)" >> "$GITHUB_ENV"

      - name: App Store Connect 업로드
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

  # 업로드 키·Play 서비스 계정 시크릿 유무를 출력으로 넘긴다(appstore-gate와 같은 이유).
  # 태그와 수동 실행 모두에서 돈다 — 수동 실행이 Play 첫 업로드용 AAB를 만든다.
  # 서명 시크릿 셋 중 하나라도 비면 빌드하지 않는다 — 빈 비밀번호로 서명을 시도하지 않게.
  android-gate:
    needs: test
    runs-on: ubuntu-latest
    # 쓰기 권한이 필요 없다 — 워크플로 전체의 contents: write를 물려받지 않는다.
    permissions:
      contents: read
    outputs:
      sign_ready: ${{ steps.check.outputs.sign_ready }}
      play_ready: ${{ steps.check.outputs.play_ready }}
    steps:
      - id: check
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          sign_ready=false
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            sign_ready=true
          else
            echo "::notice::Android 업로드 키 시크릿이 없어 AAB 빌드를 건너뜁니다(docs/deployment.md §3-3)."
          fi
          echo "sign_ready=$sign_ready" >> "$GITHUB_OUTPUT"
          if [ -n "$PLAY_JSON" ]; then
            echo "play_ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$sign_ready" = true ]; then
            echo "play_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Play 서비스 계정 시크릿이 없어 자동 업로드를 건너뜁니다. AAB는 실행 아티팩트로 남깁니다(docs/deployment.md §3-6)."
          else
            echo "play_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Play 서비스 계정 시크릿도 없습니다 — 업로드 키(§3-3)를 먼저, 서비스 계정(§3-6)은 마지막에 등록합니다(docs/deployment.md)."
          fi

  # release 스모크 — 진입점만 바꾼 release APK를 에뮬레이터에서 돌려 R8을 거친 빌드의
  # ML Kit OCR·sqlite를 확인한다(flutter drive는 release를 거부하고 profile은 R8을 안 돈다).
  # 업로드 키가 필요 없어 시크릿과 무관하게 돌고, android가 이 잡에 걸려 있어 실패하면 Play로 가지 않는다.
  android-smoke:
    needs: test
    runs-on: ubuntu-latest
    # 쓰기 권한이 필요 없다 — 워크플로 전체의 contents: write를 물려받지 않는다.
    permissions:
      contents: read
    # 부팅(600초)과 판정(300초)은 스스로 끝나지만 SDK·이미지 내려받기는 아니다 — 6시간 기본값 대신.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # 러너 이미지의 기본 JDK가 바뀌어도 빌드가 흔들리지 않게 고정한다.
      # Gradle 8.12는 JDK 24 이상에서 돌지 않고, AGP 8.9는 17 이상을 요구한다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Flutter를 로컬 개발 버전(3.44.6)에 고정한다 — stable(3.47+)은 Gradle 8.14 미만을 거부하는데
      # 이 프로젝트는 8.12다(업그레이드는 별도 정비 작업, 설계 §7). R8 빌드와 스모크를 검증한 버전과 같게 맞춘다.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
      - run: flutter pub get
      # 에뮬레이터가 부팅하기 전에 빌드해 둔다 — 빌드와 에뮬레이터가 CPU·메모리를 다투지 않게.
      - name: 스모크 APK 빌드
        run: |
          flutter build apk --release --target-platform android-x64 \
            -t integration_test/release_smoke.dart \
            --dart-define=ENABLE_OCR_DIAGNOSTICS=false
      # 에뮬레이터 하드웨어 가속 — 없으면 부팅이 수십 분 걸린다.
      - name: KVM 사용 설정
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: release 스모크 (에뮬레이터)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/release_smoke.py --apk build/app/outputs/flutter-apk/app-release.apk --timeout 300

  android:
    needs: [test, android-gate, android-smoke]
    if: needs.android-gate.outputs.sign_ready == 'true'
    runs-on: ubuntu-latest
    # 업로드 키와 Play 서비스 계정을 다루는 잡이라 저장소 쓰기 토큰을 곁에 두지 않는다
    # (contents: write는 ios 잡의 GitHub Release용이다).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # android-smoke와 같은 이유로 JDK를 고정한다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # android-smoke와 같은 이유로 Flutter를 3.44.6에 고정한다.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
      - run: flutter pub get

      # 키스토어는 작업 트리 밖(러너 임시 폴더)에 풀고, Gradle이 읽는 key.properties만 android/에 둔다.
      # 비밀번호는 env로만 받아 파일로 쓰고 로그에 찍지 않는다.
      - name: 업로드 키 복원
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.p12"
          echo "$KEYSTORE_B64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      # 진단 기능은 Play로 갈 수 있는 빌드에 절대 실리면 안 되므로 수동 실행이어도 false로 못박는다.
      - name: 서명된 .aab 빌드
        env:
          MANUAL_BUILD_NAME: ${{ inputs.build_name }}
        run: |
          BUILD_NAME="${GITHUB_REF_NAME#v}"
          if [ -n "$MANUAL_BUILD_NAME" ]; then
            BUILD_NAME="$MANUAL_BUILD_NAME"
          fi
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$BUILD_NAME" \
            --dart-define=ENABLE_OCR_DIAGNOSTICS=false

      # key.properties가 없거나 깨지면 Gradle이 조용히 debug 키로 서명한다(build.gradle.kts).
      # Play는 처음 올린 AAB의 키를 업로드 키로 등록하므로, 업로드·아티팩트보다 먼저 막는다.
      - name: 서명 확인
        run: python3 scripts/verify_aab_signature.py build/app/outputs/bundle/release/app-release.aab

      # 수동 실행(첫 수동 업로드용)이거나 서비스 계정이 아직 없으면 AAB를 버리지 않고 남긴다.
      # 매핑 파일은 R8이 난독화한 크래시 스택을 풀 때 쓴다.
      - name: AAB 아티팩트 (Play 수동 업로드용)
        if: github.event_name != 'push' || needs.android-gate.outputs.play_ready != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: beanprofile-aab-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
          retention-days: 7

      # 앱이 아직 '초안'(첫 출시 전)이면 Play API가
      # "Only releases with status draft may be created on draft app"으로 거부한다.
      # 첫 AAB는 Console에서 손으로 올린다(docs/deployment.md §3-4).
      - name: Play 내부 테스트 업로드
        if: github.event_name == 'push' && needs.android-gate.outputs.play_ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hyunwook.beanprofile
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ github.ref_name }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt
