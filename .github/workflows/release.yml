name: release

# BeanProfile 배포 파이프라인 — v* 태그 push 또는 수동 빌드 시 실행.
#
# 세 경로가 나란히 돈다:
#  - ios      : "미서명" .ipa → GitHub Release. 서명·설치는 로컬 AltStore가 담당.
#  - appstore : 서명된 .ipa → App Store Connect 업로드. 서명 시크릿이 있을 때만 실행.
#  - android  : 앱 서명 키로 서명한 .apk → GitHub Release(폰에서 받아 직접 설치). 에뮬레이터 release
#               스모크(android-smoke)를 통과해야 돈다. 수동 실행은 진단 기능을 켠 APK를 아티팩트로 남긴다.
# App Store 심사를 통과하기 전까지 AltStore 경로가 유일한 설치 수단이므로 함께 유지한다.
# 규약: docs/deployment.md · 계획: docs/plans/milestone-0-delivery.md · docs/plans/android-play-release-design.md
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_name:
        description: '빌드 버전 (예: 1.0.3) — 진단 IPA·진단 APK에 쓴다'
        required: true
        type: string

permissions:
  contents: write   # GitHub Release 생성/자산 업로드에 필요

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Codegen (drift 등) — 있을 때만
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "build_runner 미설치 — codegen 건너뜀 (M1에서 활성화)"
          fi
      - run: flutter analyze
      - run: flutter test

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # SPM 자동 마이그레이션을 끈다 — 켜두면 Pods_Runner 링크가 깨진다(§6-E).
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: Build unsigned iOS app
        env:
          MANUAL_BUILD_NAME: ${{ inputs.build_name }}
          OCR_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          BUILD_NAME="${GITHUB_REF_NAME#v}"
          if [ -n "$MANUAL_BUILD_NAME" ]; then
            BUILD_NAME="$MANUAL_BUILD_NAME"
          fi
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$BUILD_NAME" \
            --dart-define=ENABLE_OCR_DIAGNOSTICS="$OCR_DIAGNOSTICS"
      - name: Package unsigned .ipa
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 "$GITHUB_WORKSPACE/beanprofile-${GITHUB_REF_NAME}.ipa" Payload
      - name: Upload diagnostic .ipa
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: beanprofile-diagnostic-${{ inputs.build_name }}-${{ github.run_number }}
          path: beanprofile-${{ github.ref_name }}.ipa
          retention-days: 7
      - name: Publish GitHub Release (+.ipa 자산)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: BeanProfile ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            무료 Apple ID(AltStore) 경로용 **미서명** iOS 빌드.
            설치: 아이폰에서 이 .ipa를 내려받아 AltStore → My Apps → + 로 선택하면
            AltStore가 서명해 설치합니다. (PC에서 AltServer 실행 + 같은 WiFi 필요)

            Android: 이 Release에 .apk가 붙어 있으면 폰에서 내려받아 설치합니다(처음 한 번 "출처를 알 수 없는 앱" 허용).
            기존 앱 위에 그대로 덮어 설치하면 기록이 유지됩니다 — 설치가 거부돼도 앱을 지우지 마세요.
          files: beanprofile-${{ github.ref_name }}.ipa

  # 서명 시크릿이 아직 없을 때 appstore 잡을 통째로 건너뛰기 위한 게이트.
  # secrets 컨텍스트는 job 수준 if에서 못 읽으므로 별도 잡의 output으로 넘긴다.
  appstore-gate:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          if [ -n "$CERT_B64" ] && [ -n "$PROFILE_B64" ] && [ -n "$KEY_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store 서명 시크릿이 없어 업로드를 건너뜁니다. AltStore용 미서명 .ipa는 정상 생성됩니다."
          fi

  appstore:
    needs: [test, appstore-gate]
    if: needs.appstore-gate.outputs.ready == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # SPM 자동 마이그레이션을 끈다 — 켜두면 Pods_Runner 링크가 깨진다(§6-E).
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get

      - name: 배포 인증서 가져오기
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      # 프로파일 이름을 하드코딩하지 않고 프로파일 자체에서 읽어 쓴다.
      # 맥이 없어 CI 로그로만 진단해야 하므로, 이름 오타 한 글자로 막히는 경로를 없앤다
      # (.ipa 파일명을 ls로 찾는 것과 같은 이유 — docs/deployment.md §8).
      - name: 프로비저닝 프로파일 설치 + ExportOptions.plist 생성
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          dest="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dest"
          echo "$PROFILE_B64" | base64 -d > /tmp/profile.mobileprovision
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/profile.plist)
          cp /tmp/profile.mobileprovision "$dest/$uuid.mobileprovision"
          echo "프로파일 '$name' / UUID $uuid / 팀 $team"
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$team</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hyunwook.beanprofile</key><string>$uuid</string>
            </dict>
          </dict>
          </plist>
          EOF

      # 진단 기능은 App Store 빌드에 절대 실리면 안 되므로 false로 못박는다.
      - name: 서명된 .ipa 빌드
        run: |
          BUILD_NAME="${GITHUB_REF_NAME#v}"
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$BUILD_NAME" \
            --dart-define=ENABLE_OCR_DIAGNOSTICS=false \
            --export-options-plist=ios/ExportOptions.plist

      - name: .ipa 경로 확인
        run: echo "IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)" >> "$GITHUB_ENV"

      - name: App Store Connect 업로드
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

  # 앱 서명 키 시크릿 유무를 출력으로 넘긴다(appstore-gate와 같은 이유).
  # 태그와 수동 실행 모두에서 돈다 — 수동 실행이 진단 APK를 만든다.
  # 시크릿 셋 중 하나라도 비면 빌드하지 않는다 — 빈 비밀번호로 서명을 시도하지 않게.
  # 인증서 지문 변수도 있어야 한다 — 없으면 시크릿의 키가 백업한 키인지 대조할 수 없다.
  android-gate:
    needs: test
    runs-on: ubuntu-latest
    # 쓰기 권한이 필요 없다 — 워크플로 전체의 contents: write를 물려받지 않는다.
    permissions:
      contents: read
    outputs:
      sign_ready: ${{ steps.check.outputs.sign_ready }}
    steps:
      - id: check
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$CERT_SHA256" ]; then
            echo "sign_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android 앱 서명 키 시크릿이나 인증서 지문 변수(ANDROID_CERT_SHA256)가 없어 APK 빌드를 건너뜁니다(docs/deployment.md §3-2)."
          fi

  # release 스모크 — 진입점만 바꾼 release APK를 에뮬레이터에서 돌려 R8을 거친 빌드의
  # ML Kit OCR·sqlite를 확인한다(flutter drive는 release를 거부하고 profile은 R8을 안 돈다).
  # 서명 키가 필요 없어 시크릿과 무관하게 돌고, android가 이 잡에 걸려 있어 실패하면 APK가 나가지 않는다.
  android-smoke:
    needs: test
    runs-on: ubuntu-latest
    # 쓰기 권한이 필요 없다 — 워크플로 전체의 contents: write를 물려받지 않는다.
    permissions:
      contents: read
    # 부팅(600초)과 판정(300초)은 스스로 끝나지만 SDK·이미지 내려받기는 아니다 — 6시간 기본값 대신.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # 러너 이미지의 기본 JDK가 바뀌어도 빌드가 흔들리지 않게 고정한다.
      # Gradle 8.12는 JDK 24 이상에서 돌지 않고, AGP 8.9는 17 이상을 요구한다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Flutter를 로컬 개발 버전(3.44.6)에 고정한다 — stable(3.47+)은 Gradle 8.14 미만을 거부하는데
      # 이 프로젝트는 8.12다(업그레이드는 별도 정비 작업, 설계 §7). R8 빌드와 스모크를 검증한 버전과 같게 맞춘다.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
      - run: flutter pub get
      # 에뮬레이터가 부팅하기 전에 빌드해 둔다 — 빌드와 에뮬레이터가 CPU·메모리를 다투지 않게.
      - name: 스모크 APK 빌드
        run: |
          flutter build apk --release --target-platform android-x64 \
            -t integration_test/release_smoke.dart \
            --dart-define=ENABLE_OCR_DIAGNOSTICS=false
      # 에뮬레이터 하드웨어 가속 — 없으면 부팅이 수십 분 걸린다.
      - name: KVM 사용 설정
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: release 스모크 (에뮬레이터)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/release_smoke.py --apk build/app/outputs/flutter-apk/app-release.apk --timeout 300

  android:
    needs: [test, android-gate, android-smoke]
    if: needs.android-gate.outputs.sign_ready == 'true'
    runs-on: ubuntu-latest
    # 앱 서명 키가 디스크에 풀리는 잡이라 저장소 쓰기 토큰을 곁에 두지 않는다.
    # Release에 붙이는 일은 키가 없는 android-release 잡이 한다.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # android-smoke와 같은 이유로 JDK를 고정한다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # android-smoke와 같은 이유로 Flutter를 3.44.6에 고정한다.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
      - run: flutter pub get

      # 키스토어는 작업 트리 밖(러너 임시 폴더)에 풀고, Gradle이 읽는 key.properties만 android/에 둔다.
      # 비밀번호는 env로만 받아 파일로 쓰고 로그에 찍지 않는다.
      - name: 앱 서명 키 복원
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/beanprofile-release.p12"
          echo "$KEYSTORE_B64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      # 어느 폰에나 깔리는 universal APK 하나. 진단 기능은 태그 빌드에선 끄고 수동 실행(진단 빌드)에서만 켠다 —
      # 같은 키로 서명되므로 진단 빌드를 폰에 덮어 깔아도 기록이 유지된다(iOS 수동 실행과 같은 규칙).
      - name: 서명된 .apk 빌드
        env:
          MANUAL_BUILD_NAME: ${{ inputs.build_name }}
          OCR_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          BUILD_NAME="${GITHUB_REF_NAME#v}"
          if [ -n "$MANUAL_BUILD_NAME" ]; then
            BUILD_NAME="$MANUAL_BUILD_NAME"
          fi
          flutter build apk --release \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$BUILD_NAME" \
            --dart-define=ENABLE_OCR_DIAGNOSTICS="$OCR_DIAGNOSTICS"

      # key.properties가 없으면 Gradle이 조용히 debug 키로 서명한다(build.gradle.kts). 그리고 시크릿에
      # 백업과 다른 키가 들어가 있으면 그 키가 폰의 신원이 돼 버린다. 둘 다 내보내기 전에 막는다 —
      # 인증서 지문을 백업 파일에서 계산한 저장소 변수와 대조한다(docs/deployment.md §3-2).
      - name: 서명 확인
        env:
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: python3 scripts/verify_apk_signature.py --expect-sha256 "$CERT_SHA256" build/app/outputs/flutter-apk/app-release.apk

      # 태그는 Release에 붙일 이름으로, 수동 실행은 진단 빌드임이 드러나는 이름으로 남긴다.
      # 매핑 파일은 R8이 난독화한 크래시 스택을 풀 때 쓴다 — 태그 빌드는 90일 보관.
      - name: APK 이름 붙이기
        env:
          MANUAL_BUILD_NAME: ${{ inputs.build_name }}
        run: |
          mkdir -p dist
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/beanprofile-${GITHUB_REF_NAME}.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk "dist/beanprofile-diagnostic-${MANUAL_BUILD_NAME}-${GITHUB_RUN_NUMBER}.apk"
          fi
          cp build/app/outputs/mapping/release/mapping.txt dist/
      - name: APK 아티팩트
        uses: actions/upload-artifact@v6
        with:
          name: beanprofile-apk-${{ github.run_number }}
          path: dist/
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

  # 태그 실행에서만 APK를 GitHub Release에 붙인다. 쓰기 토큰은 이 잡에만 주고, 서명 키는 여기 없다.
  # ios 잡도 같은 Release를 만들지만 action-gh-release가 동시 생성을 스스로 정리하므로 순서는 상관없다.
  # 단 저장소의 immutable releases 설정을 켜면 나중에 끝나는 잡이 파일을 붙이지 못한다 — 켜지 않는다.
  android-release:
    needs: android
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: beanprofile-apk-${{ github.run_number }}
          path: dist
      - name: GitHub Release에 .apk 붙이기
        uses: softprops/action-gh-release@v3
        with:
          name: BeanProfile ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/beanprofile-${{ github.ref_name }}.apk
          # 기본값은 파일이 없어도 경고만 하고 초록이다 — APK 없는 Release가 조용히 나가지 않게.
          fail_on_unmatched_files: true
